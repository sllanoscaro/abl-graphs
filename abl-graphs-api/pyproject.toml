[project]
name = "abl-graphs-api"
version = "1.0.0"
description = "API backend para el sistema de monitoreo de misiones de drones ABL"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "watchdog>=3.0.0",
    "paho-mqtt>=1.6.0",
    "pymongo>=4.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

